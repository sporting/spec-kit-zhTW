description = "在任務生成後，對 spec.md、plan.md 和 tasks.md 進行非破壞性的跨文件一致性與品質分析。"

prompt = """
---
description: 在任務生成後，對 spec.md、plan.md 和 tasks.md 進行非破壞性的跨文件一致性與品質分析。
---

## 使用者輸入

```text
$ARGUMENTS
```

您**必須**在繼續之前考慮使用者輸入（如果非空）。

## 目標

在實作之前，識別三個核心文件 (`spec.md`、`plan.md`、`tasks.md`) 之間的不一致性、重複、模糊不清和規範不足的項目。此命令**必須**在 `/speckit.tasks` 成功產生完整的 `tasks.md` 之後執行。

## 操作限制

**嚴格只讀**：**請勿**修改任何檔案。輸出結構化的分析報告。提供一個可選的修復計畫（使用者必須明確批准後，才能手動調用任何後續的編輯命令）。

**憲章權威**：專案憲章 (`.specify/memory/constitution.md`) 在此分析範圍內是**不可協商的**。憲章衝突會自動被視為**嚴重 (CRITICAL)** 問題，需要調整規格、計畫或任務——而不是稀釋、重新解釋或默默忽略原則。如果原則本身需要更改，則必須在 `/speckit.analyze` 之外，透過單獨、明確的憲章更新來進行。

## 執行步驟

### 1. 初始化分析上下文

從儲存庫根目錄執行一次 `.specify/scripts/powershell/check-prerequisites.ps1 -Json -RequireTasks -IncludeTasks`，並解析 JSON 以獲取 FEATURE_DIR 和 AVAILABLE_DOCS。推導出絕對路徑：

- SPEC = FEATURE_DIR/spec.md
- PLAN = FEATURE_DIR/plan.md
- TASKS = FEATURE_DIR/tasks.md

如果任何必要檔案遺失，則中止並顯示錯誤訊息（指示使用者執行遺失的先決條件命令）。
對於像 "I'm Groot" 這樣的參數中的單引號，請使用跳脫語法：例如 'I'\''m Groot'（如果可能，也可以使用雙引號："I'm Groot"）。

### 2. 載入文件 (漸進式揭露)

僅從每個文件載入最少必要的上下文：

**從 spec.md：**

- 概述/背景
- 功能需求
- 非功能需求
- 使用者故事
- 邊緣案例（如果存在）

**從 plan.md：**

- 架構/技術棧選擇
- 資料模型參考
- 階段
- 技術限制

**從 tasks.md：**

- 任務 ID
- 描述
- 階段分組
- 平行標記 [P]
- 參考檔案路徑

**從憲章：**

- 載入 `.specify/memory/constitution.md` 以進行原則驗證

### 3. 建立語義模型

建立內部表示（輸出中不包含原始文件）：

- **需求清單**：每個功能性 + 非功能性需求都帶有一個穩定的鍵（根據祈使句推導出 slug；例如，「使用者可以上傳檔案」→ `user-can-upload-file`）
- **使用者故事/行動清單**：具有驗收標準的離散使用者行動
- **任務覆蓋映射**：將每個任務映射到一個或多個需求或故事（透過關鍵字/明確參考模式，如 ID 或關鍵短語進行推斷）
- **憲章規則集**：提取原則名稱和 MUST/SHOULD 規範性陳述

### 4. 偵測階段 (令牌效率分析)

專注於高訊號發現。總共限制為 50 個發現；其餘的匯總在溢出摘要中。

#### A. 重複偵測

- 識別近似重複的需求
- 標記品質較低的措辭以進行整合

#### B. 模糊偵測

- 標記缺乏可衡量標準的模糊形容詞（快速、可擴展、安全、直觀、穩健）
- 標記未解決的佔位符（TODO、TKTK、???、`<placeholder>` 等）

#### C. 規範不足

- 具有動詞但缺少物件或可衡量結果的需求
- 缺少驗收標準對齊的使用者故事
- 任務引用了規格/計畫中未定義的檔案或組件

#### D. 憲章對齊

- 任何與 MUST 原則衝突的需求或計畫元素
- 憲章中缺少強制性部分或品質門檻

#### E. 覆蓋缺口

- 零相關任務的需求
- 沒有映射到需求/故事的任務
- 未在任務中反映的非功能需求（例如，效能、安全性）

#### F. 不一致性

- 術語漂移（相同概念在不同檔案中命名不同）
- 計畫中引用但在規格中缺失的資料實體（反之亦然）
- 任務排序矛盾（例如，整合任務在基礎設定任務之前，但沒有依賴說明）
- 衝突的需求（例如，一個要求 Next.js，另一個指定 Vue）

### 5. 嚴重性分配

使用此啟發式方法來優先處理發現：

- **嚴重 (CRITICAL)**：違反憲章 MUST 原則、缺少核心規格文件，或零覆蓋率且阻礙基本功能的需求
- **高 (HIGH)**：重複或衝突的需求、模糊的安全/效能屬性、不可測試的驗收標準
- **中 (MEDIUM)**：術語漂移、缺少非功能任務覆蓋、規範不足的邊緣案例
- **低 (LOW)**：風格/措辭改進、不影響執行順序的輕微冗餘

### 6. 產生簡潔分析報告

輸出 Markdown 報告（不寫入檔案），結構如下：

## 規格分析報告

| ID | 類別 | 嚴重性 | 位置 | 摘要 | 建議 |
|----|----------|----------|-------------|---------|----------------|
| A1 | 重複 | 高 | spec.md:L120-134 | 兩個相似的需求... | 合併措辭；保留更清晰的版本 |

（每個發現新增一行；產生以類別首字母為前綴的穩定 ID。）

**覆蓋摘要表：**

| 需求鍵 | 有任務嗎？ | 任務 ID | 備註 |
|-----------------|-----------|----------|-------|

**憲章對齊問題：** (如果有的話)

**未映射任務：** (如果有的話)

**指標：**

- 總需求數
- 總任務數
- 覆蓋率 % (至少有 1 個任務的需求)
- 模糊計數
- 重複計數
- 嚴重問題計數

### 7. 提供後續行動

在報告末尾，輸出一個簡潔的「後續行動」區塊：

- 如果存在**嚴重 (CRITICAL)** 問題：建議在 `/speckit.implement` 之前解決
- 如果只有**低 (LOW)**/ **中 (MEDIUM)** 問題：使用者可以繼續，但提供改進建議
- 提供明確的命令建議：例如，「執行 `/speckit.specify` 進行細化」、「執行 `/speckit.plan` 調整架構」、「手動編輯 tasks.md 以增加對『效能指標』的覆蓋」

### 8. 提供修復建議

詢問使用者：「您希望我為前 N 個問題提供具體的修復編輯建議嗎？」(請勿自動應用。)

## 操作原則

### 上下文效率

- **最少高訊號令牌**：專注於可操作的發現，而非詳盡的文件
- **漸進式揭露**：逐步載入文件；不要將所有內容傾倒到分析中
- **令牌效率輸出**：將發現表限制為 50 行；匯總溢出部分
- **確定性結果**：在不更改的情況下重新執行應產生一致的 ID 和計數

### 分析指南

- **絕不修改檔案**（這是只讀分析）
- **絕不虛構缺失部分**（如果缺失，請準確報告）
- **優先處理憲章違規**（這些始終是**嚴重 (CRITICAL)** 問題）
- **使用範例而非詳盡規則**（引用特定實例，而非通用模式）
- **優雅地報告零問題**（發出包含覆蓋統計的成功報告）

