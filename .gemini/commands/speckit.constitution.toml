description = "根據互動式或提供的原則輸入，建立或更新專案章程，確保所有相關範本保持同步。"

prompt = """
---
description: 根據互動式或提供的原則輸入，建立或更新專案章程，確保所有相關範本保持同步。
handoffs: 
  - label: 建立規格
    agent: speckit.specify
    prompt: 根據更新後的章程實作功能規格。我想要建立...
---

## 使用者輸入

```text
$ARGUMENTS
```

您**必須**在繼續之前考慮使用者輸入（如果非空）。

## 概述

您正在更新位於 `.specify/memory/constitution.md` 的專案章程。此檔案是一個包含方括號中佔位符標記（例如 `[PROJECT_NAME]`、`[PRINCIPLE_1_NAME]`）的**範本**。您的工作是 (a) 收集/推導具體值，(b) 精確填寫範本，以及 (c) 將任何修訂傳播到相關文件。

請遵循此執行流程：

1.  載入位於 `.specify/memory/constitution.md` 的現有章程範本。
    -   識別所有形式為 `[ALL_CAPS_IDENTIFIER]` 的佔位符標記。
    **重要**：使用者可能需要比範本中使用的原則更少或更多的原則。如果指定了數量，請遵守——遵循通用範本。您將相應地更新文件。

2.  收集/推導佔位符的值：
    -   如果使用者輸入（對話）提供了值，請使用它。
    -   否則，從現有儲存庫上下文（README、文件、如果嵌入的先前章程版本）推斷。
    -   對於治理日期：`RATIFICATION_DATE` 是原始採納日期（如果未知則詢問或標記 TODO），如果進行了更改，`LAST_AMENDED_DATE` 是今天，否則保留先前日期。
    -   `CONSTITUTION_VERSION` 必須根據語義版本控制規則遞增：
        -   MAJOR：向後不相容的治理/原則移除或重新定義。
        -   MINOR：新增原則/區段或實質性擴展指南。
        -   PATCH：澄清、措辭、錯字修正、非語義細化。
    -   如果版本遞增類型不明確，請在最終確定前提出理由。

3.  草擬更新後的章程內容：
    -   用具體文字替換每個佔位符（除了專案選擇尚未定義的有意保留的範本槽位外，不留下任何方括號標記——明確說明任何保留的原因）。
    -   保留標題層次結構，一旦替換，註解可以移除，除非它們仍然提供澄清指南。
    -   確保每個原則區段：簡潔的名稱行，捕捉不可協商規則的段落（或項目符號列表），如果不明顯則明確說明理由。
    -   確保治理區段列出修訂程序、版本控制政策和合規性審查預期。

4.  一致性傳播檢查清單（將先前的檢查清單轉換為活動驗證）：
    -   閱讀 `.specify/templates/plan-template.md` 並確保任何「章程檢查」或規則與更新後的原則保持一致。
    -   閱讀 `.specify/templates/spec-template.md` 以進行範圍/需求對齊——如果章程新增/移除了強制性區段或限制，則進行更新。
    -   閱讀 `.specify/templates/tasks-template.md` 並確保任務分類反映了新的或移除的原則驅動任務類型（例如，可觀察性、版本控制、測試紀律）。
    -   閱讀 `.specify/templates/commands/*.md` 中的每個命令檔案（包括此檔案），以驗證在需要通用指南時沒有過時的參考（例如，僅限 CLAUDE 等代理特定名稱）仍然存在。
    -   閱讀任何運行時指南文件（例如，`README.md`、`docs/quickstart.md` 或如果存在的代理特定指南檔案）。更新對已更改原則的參考。

5.  產生同步影響報告（更新後作為 HTML 註解預置在章程檔案頂部）：
    -   版本變更：舊 → 新
    -   修改的原則列表（如果重新命名，則為舊標題 → 新標題）
    -   新增的區段
    -   移除的區段
    -   需要更新的範本（✅ 已更新 / ⚠ 待處理），附帶檔案路徑
    -   如果任何佔位符有意延遲，則為後續待辦事項。

6.  最終輸出前的驗證：
    -   沒有剩餘未解釋的方括號標記。
    -   版本行與報告匹配。
    -   日期為 ISO 格式 YYYY-MM-DD。
    -   原則是宣告性的、可測試的，並且沒有模糊語言（「應該」→ 在適當情況下替換為 MUST/SHOULD 理由）。

7.  將完成的章程寫回 `.specify/memory/constitution.md`（覆蓋）。

8.  向使用者輸出最終摘要，包含：
    -   新版本和遞增理由。
    -   任何標記為需要手動後續處理的檔案。
    -   建議的提交訊息（例如，`docs: amend constitution to vX.Y.Z (principle additions + governance update)`）。

格式與風格要求：

-   使用與範本中完全相同的 Markdown 標題（不要降級/升級層級）。
-   換行長理由行以保持可讀性（理想情況下 <100 個字元），但不要以不自然的斷行強制執行。
-   區段之間保留一個空行。
-   避免尾隨空白。

如果使用者提供部分更新（例如，僅修訂一個原則），仍執行驗證和版本決策步驟。

如果缺少關鍵資訊（例如，批准日期確實未知），則插入 `TODO(<FIELD_NAME>): explanation` 並包含在同步影響報告的延遲項目下。

不要建立新範本；始終操作現有的 `.specify/memory/constitution.md` 檔案。
"""
