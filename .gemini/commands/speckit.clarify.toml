description = "透過提出最多 5 個高度針對性的澄清問題，識別當前功能規格中規範不足的區域，並將答案編碼回規格中。"

prompt = """
---
description: 透過提出最多 5 個高度針對性的澄清問題，識別當前功能規格中規範不足的區域，並將答案編碼回規格中。
handoffs: 
  - label: 建立技術計畫
    agent: speckit.plan
    prompt: 為規格建立一個計畫。我正在使用...
---

## 使用者輸入

```text
$ARGUMENTS
```

您**必須**在繼續之前考慮使用者輸入（如果非空）。

## 概述

目標：偵測並減少活動功能規格中的模糊性或缺失的決策點，並將澄清直接記錄在規格檔案中。

注意：此澄清工作流程預計在調用 `/speckit.plan` 之前執行（並完成）。如果使用者明確表示他們跳過澄清（例如，探索性試驗），您可以繼續，但必須警告下游返工風險會增加。

執行步驟：

1.  從儲存庫根目錄**一次**執行 `.specify/scripts/powershell/check-prerequisites.ps1 -Json -PathsOnly`（組合 `--json --paths-only` 模式 / `-Json -PathsOnly`）。解析最少的 JSON 負載欄位：
    -   `FEATURE_DIR`
    -   `FEATURE_SPEC`
    -   （可選地捕獲 `IMPL_PLAN`、`TASKS` 以用於未來鏈式流程。）
    -   如果 JSON 解析失敗，則中止並指示使用者重新執行 `/speckit.specify` 或驗證功能分支環境。
    -   對於像 "I'm Groot" 這樣的參數中的單引號，請使用跳脫語法：例如 'I'\''m Groot'（如果可能，也可以使用雙引號："I'm Groot"）。

2.  載入當前規格檔案。使用此分類法執行結構化的模糊性與覆蓋率掃描。對於每個類別，標記狀態：清晰 / 部分 / 缺失。產生用於優先排序的內部覆蓋率地圖（除非不提出問題，否則不輸出原始地圖）。

    功能範圍與行為：
    -   核心使用者目標與成功標準
    -   明確的範圍外聲明
    -   使用者角色 / 人物誌區分

    領域與資料模型：
    -   實體、屬性、關係
    -   身份與唯一性規則
    -   生命週期/狀態轉換
    -   資料量 / 規模假設

    互動與使用者體驗流程：
    -   關鍵使用者旅程 / 序列
    -   錯誤/空/載入狀態
    -   無障礙或本地化備註

    非功能品質屬性：
    -   效能（延遲、吞吐量目標）
    -   可擴展性（水平/垂直、限制）
    -   可靠性與可用性（正常運行時間、恢復預期）
    -   可觀察性（日誌、指標、追蹤訊號）
    -   安全性與隱私（身份驗證/授權、資料保護、威脅假設）
    -   合規性 / 法規限制（如果有的話）

    整合與外部依賴項：
    -   外部服務/API 與故障模式
    -   資料匯入/匯出格式
    -   協定/版本控制假設

    邊緣案例與故障處理：
    -   負面情境
    -   速率限制 / 節流
    -   衝突解決（例如，並發編輯）

    限制與權衡：
    -   技術限制（語言、儲存、託管）
    -   明確的權衡或被拒絕的替代方案

    術語與一致性：
    -   規範詞彙表術語
    -   避免的同義詞 / 已棄用術語

    完成訊號：
    -   驗收標準可測試性
    -   可衡量的「完成定義」風格指標

    雜項 / 佔位符：
    -   TODO 標記 / 未解決的決策
    -   缺乏量化的模糊形容詞（「穩健」、「直觀」）

    對於每個狀態為「部分」或「缺失」的類別，新增一個候選問題機會，除非：
    -   澄清不會實質性改變實作或驗證策略
    -   資訊最好推遲到規劃階段（內部備註）

3.  （內部）生成一個優先級的候選澄清問題佇列（最多 5 個）。**請勿**一次全部輸出。應用這些限制：
    -   整個會話中最多 10 個問題。
    -   每個問題必須可以透過以下方式回答：
        -   簡短的多選（2-5 個不同、互斥的選項），**或**
        -   一個單詞 / 簡短短語答案（明確限制：「答案 <=5 個字」）。
    -   僅包含其答案實質性影響架構、資料建模、任務分解、測試設計、使用者體驗行為、操作準備或合規性驗證的問題。
    -   確保類別覆蓋率平衡：嘗試首先覆蓋影響最大的未解決類別；當單一高影響區域（例如，安全態勢）未解決時，避免提出兩個低影響問題。
    -   排除已回答的問題、微不足道的風格偏好或計畫級別的執行細節（除非阻礙正確性）。
    -   偏好能減少下游返工風險或防止驗收測試不一致的澄清。
    -   如果超過 5 個類別仍未解決，則根據（影響 * 不確定性）啟發式選擇前 5 個。

4.  順序提問循環（互動式）：
    -   一次呈現**恰好一個**問題。
    -   對於多選問題：
        -   **分析所有選項**並根據以下因素確定**最合適的選項**：
            -   專案類型的最佳實踐
            -   類似實作中的常見模式
            -   風險降低（安全性、效能、可維護性）
            -   與規格中可見的任何明確專案目標或限制保持一致
        -   在頂部**顯著呈現您推薦的選項**，並附上清晰的理由（1-2 句話解釋為何這是最佳選擇）。
        -   格式為：`**推薦：** 選項 [X] - <理由>`
        -   然後將所有選項呈現為 Markdown 表格：

        | 選項 | 描述 |
        |--------|-------------|
        | A | <選項 A 描述> |
        | B | <選項 B 描述> |
        | C | <選項 C 描述> (根據需要新增 D/E，最多 5 個) |
        | Short | 提供不同的簡短答案 (<=5 個字) (僅在自由形式替代方案適用時包含) |

        -   表格後新增：`您可以回覆選項字母（例如，「A」），透過說「yes」或「recommended」接受推薦，或提供您自己的簡短答案。`
    -   對於簡答題（沒有有意義的離散選項）：
        -   根據最佳實踐和上下文提供您的**建議答案**。
        -   格式為：`**建議：** <您建議的答案> - <簡要理由>`
        -   然後輸出：`格式：簡答 (<=5 個字)。您可以透過說「yes」或「suggested」接受建議，或提供您自己的答案。`
    -   使用者回答後：
        -   如果使用者回覆「yes」、「recommended」或「suggested」，則使用您先前陳述的推薦/建議作為答案。
        -   否則，驗證答案是否映射到一個選項或符合 <=5 個字的限制。
        -   如果模糊，請要求快速消除歧義（計數仍屬於同一問題；不要推進）。
        -   一旦滿意，將其記錄在工作記憶中（尚未寫入磁碟）並轉到下一個排隊問題。
    -   在以下情況下停止提出更多問題：
        -   所有關鍵模糊性都已提早解決（剩餘的排隊項目變得不必要），**或**
        -   使用者發出完成訊號（「完成」、「好的」、「沒有了」），**或**
        -   您達到 5 個已提出的問題。
    -   絕不提前揭示未來排隊的問題。
    -   如果開始時沒有有效問題，則立即報告沒有值得正式澄清的關鍵模糊性。

5.  每次接受答案後整合（增量更新方法）：
    -   維護規格的記憶體表示（啟動時載入一次）以及原始檔案內容。
    -   對於本次會話中第一個整合的答案：
        -   確保存在 `## Clarifications` 區段（如果缺失，則在規格範本中最高層級的上下文/概述區段之後建立）。
        -   在其下方，為今天建立（如果不存在）一個 `### Session YYYY-MM-DD` 副標題。
    -   接受後立即附加一個項目符號行：`- Q: <問題> → A: <最終答案>`。
    -   然後立即將澄清應用於最合適的區段：
        -   功能模糊性 → 在功能需求中更新或新增一個項目符號。
        -   使用者互動 / 參與者區分 → 在使用者故事或參與者子區段（如果存在）中更新澄清的角色、限制或情境。
        -   資料形狀 / 實體 → 更新資料模型（新增欄位、類型、關係），保留順序；簡潔地註明新增的限制。
        -   非功能限制 → 在非功能 / 品質屬性區段中新增/修改可衡量標準（將模糊形容詞轉換為指標或明確目標）。
        -   邊緣案例 / 負面流程 → 在邊緣案例 / 錯誤處理中新增一個項目符號（或建立此類子區段，如果範本提供佔位符）。
        -   術語衝突 → 在規格中規範化術語；僅在必要時保留原始術語，方法是新增一次 `（以前稱為「X」）`。
    -   如果澄清使較早的模糊陳述失效，則替換該陳述而不是重複；不要留下過時的矛盾文字。
    -   每次整合後立即儲存規格檔案，以最大程度地降低上下文丟失的風險（原子覆蓋）。
    -   保留格式：不要重新排序不相關的區段；保持標題層次結構完整。
    -   保持每個插入的澄清最小化且可測試（避免敘述性漂移）。

6.  驗證（在每次寫入和最終遍歷後執行）：
    -   澄清會話中每個接受的答案恰好包含一個項目符號（無重複）。
    -   已提出（已回答）問題總數 ≤ 5。
    -   更新的區段不包含新的答案旨在解決的任何殘留模糊佔位符。
    -   沒有矛盾的較早陳述仍然存在（掃描已刪除的現在無效的替代選擇）。
    -   Markdown 結構有效；僅允許新的標題：`## Clarifications`、`### Session YYYY-MM-DD`。
    -   術語一致性：所有更新的區段都使用相同的規範術語。

7.  將更新後的規格寫回 `FEATURE_SPEC`。

8.  報告完成（在提問循環結束或提前終止後）：
    -   已提出和已回答的問題數量。
    -   更新規格的路徑。
    -   已觸及的區段（列出名稱）。
    -   覆蓋率摘要表，列出每個分類類別及其狀態：已解決（曾為部分/缺失並已處理）、延遲（超出問題配額或更適合規劃）、清晰（已足夠）、未解決（仍為部分/缺失但影響較低）。
    -   如果仍有任何未解決或延遲的項目，建議是繼續進行 `/speckit.plan` 還是稍後在計畫後再次執行 `/speckit.clarify`。
    -   建議的下一個命令。

行為規則：

-   如果沒有發現有意義的模糊性（或所有潛在問題的影響都很低），則回應：「未偵測到值得正式澄清的關鍵模糊性。」並建議繼續。
-   如果規格檔案缺失，則指示使用者先執行 `/speckit.specify`（不要在此處建立新規格）。
-   提出的問題總數絕不超過 5 個（單個問題的澄清重試不計為新問題）。
-   避免推測性技術棧問題，除非其缺失阻礙了功能清晰度。
-   尊重使用者提前終止訊號（「停止」、「完成」、「繼續」）。
-   如果由於完全覆蓋而未提出問題，則輸出一個簡潔的覆蓋率摘要（所有類別均為「清晰」），然後建議推進。
-   如果配額已達，但仍有未解決的高影響類別，則在「延遲」下明確標記它們並附上理由。

優先級上下文：{{args}}
"""
