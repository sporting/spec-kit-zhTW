description = "使用計畫範本執行實作規劃工作流程以生成設計產物。"

prompt = """
---
description: 使用計畫範本執行實作規劃工作流程以生成設計產物。
handoffs: 
  - label: 建立任務
    agent: speckit.tasks
    prompt: 將計畫分解為任務
    send: true
  - label: 建立檢查清單
    agent: speckit.checklist
    prompt: 為以下領域建立檢查清單...
---

## 使用者輸入

```text
$ARGUMENTS
```

您**必須**在繼續之前考慮使用者輸入（如果非空）。

## 概述

1.  **設定**：從儲存庫根目錄執行 `.specify/scripts/powershell/setup-plan.ps1 -Json`，並解析 JSON 以獲取 FEATURE_SPEC、IMPL_PLAN、SPECS_DIR、BRANCH。對於像 "I'm Groot" 這樣的參數中的單引號，請使用跳脫語法：例如 'I'\''m Groot'（如果可能，也可以使用雙引號："I'm Groot"）。

2.  **載入上下文**：讀取 FEATURE_SPEC 和 `.specify/memory/constitution.md`。載入 IMPL_PLAN 範本（已複製）。

3.  **執行計畫工作流程**：遵循 IMPL_PLAN 範本中的結構來：
    -   填寫技術上下文（將未知項標記為「需要澄清」）
    -   從章程中填寫章程檢查區段
    -   評估閘門（如果違規不合理則**錯誤**）
    -   階段 0：生成 research.md（解決所有「需要澄清」）
    -   階段 1：生成 data-model.md、contracts/、quickstart.md
    -   階段 1：透過執行代理腳本更新代理上下文
    -   設計後重新評估章程檢查

4.  **停止並報告**：命令在階段 2 規劃後結束。報告分支、IMPL_PLAN 路徑和生成的產物。

## 階段

### 階段 0：概述與研究

1.  **從上述技術上下文提取未知項**：
    -   對於每個「需要澄清」→ 研究任務
    -   對於每個依賴項 → 最佳實踐任務
    -   對於每個整合 → 模式任務

2.  **生成並分派研究代理**：

    ```text
    對於技術上下文中的每個未知項：
      任務：「研究 {未知項} 以獲取 {功能上下文}」
    對於每個技術選擇：
      任務：「尋找 {領域} 中 {技術} 的最佳實踐」
    ```

3.  **將發現整合**到 `research.md` 中，使用以下格式：
    -   決策：[選擇了什麼]
    -   理由：[為何選擇]
    -   考慮的替代方案：[還評估了什麼]

**輸出**：research.md，所有「需要澄清」都已解決

### 階段 1：設計與合約

**先決條件**：`research.md` 完成

1.  **從功能規格中提取實體** → `data-model.md`：
    -   實體名稱、欄位、關係
    -   來自需求的驗證規則
    -   如果適用，則為狀態轉換

2.  **從功能需求生成 API 合約**：
    -   對於每個使用者操作 → 端點
    -   使用標準 REST/GraphQL 模式
    -   將 OpenAPI/GraphQL 模式輸出到 `/contracts/`

3.  **代理上下文更新**：
    -   執行 `.specify/scripts/powershell/update-agent-context.ps1 -AgentType gemini`
    -   這些腳本會偵測正在使用的 AI 代理
    -   更新適當的代理特定上下文檔案
    -   僅從當前計畫中新增新技術
    -   保留標記之間的手動新增內容

**輸出**：data-model.md、/contracts/*、quickstart.md、代理特定檔案

## 關鍵規則

-   使用絕對路徑
-   閘門失敗或未解決的澄清會導致**錯誤**
"